header:
  version: 14

distro: blackhole

target:
  - blackhole-image

repos:
  poky:
    url: https://git.yoctoproject.org/git/poky
    branch: scarthgap
    layers:
      meta:
      meta-poky:

  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    branch: scarthgap
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-multimedia:
      meta-webserver:

  meta-raspberrypi:
    url: https://github.com/agherzan/meta-raspberrypi
    branch: scarthgap

  # meta-clang + meta-browser are only needed to compile Chromium from source.
  # Default images use chromium-bin (Chrome for Testing) instead.

  meta-rauc:
    url: https://github.com/rauc/meta-rauc
    branch: scarthgap

  meta-rauc-community:
    url: https://github.com/rauc/meta-rauc-community
    branch: scarthgap
    layers:
      meta-rauc-raspberrypi:
      meta-rauc-qemux86:

  # Required by meta-rauc-raspberrypi (LAYERDEPENDS: lts-u-boot-mixin).
  # Also supplies newer U-Boot for raspberrypi5 on Scarthgap.
  meta-lts-mixins:
    url: https://git.yoctoproject.org/git/meta-lts-mixins
    branch: scarthgap/u-boot

  meta-blackhole:
    path: meta-blackhole

local_conf_header:
  blackhole-common: |
    CONF_VERSION = "2"
    PACKAGE_CLASSES = "package_ipk"
    EXTRA_IMAGE_FEATURES ?= "debug-tweaks"
    USER_CLASSES ?= "buildstats"
    PATCHRESOLVE = "noop"
    # Required for Raspberry Pi CYW43xx Wi-Fi firmware (meta-raspberrypi).
    LICENSE_FLAGS_ACCEPTED += "synaptics-killswitch"
    # Inode thresholds must be "100K" not "100M" — Docker Desktop volumes
    # often have ~60M total inodes, so a 100M free-inode floor always trips.
    BB_DISKMON_DIRS ??= "\
        STOPTASKS,${TMPDIR},1G,100K \
        STOPTASKS,${DL_DIR},1G,100K \
        STOPTASKS,${SSTATE_DIR},1G,100K \
        STOPTASKS,/tmp,100M,10K \
        HALT,${TMPDIR},100M,1K \
        HALT,${DL_DIR},100M,1K \
        HALT,${SSTATE_DIR},100M,1K \
        HALT,/tmp,10M,1K"
    DISTRO_FEATURES:append = " rauc systemd wayland opengl"
    IMAGE_FSTYPES:append = " ext4 wic wic.bmap"
    IMAGE_INSTALL:append = " rauc"
    # Chromium builds are heavy — keep defaults on big Linux hosts.
    # Override for Docker Desktop on Mac with limited RAM:
    #   BB_NUMBER_THREADS = "2"
    #   PARALLEL_MAKE = "-j 2"
    BB_NUMBER_THREADS ?= "${@oe.utils.cpu_count()}"
    PARALLEL_MAKE ?= "-j ${@oe.utils.cpu_count()}"
