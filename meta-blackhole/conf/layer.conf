# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "blackhole"
BBFILE_PATTERN_blackhole = "^${LAYERDIR}/"
BBFILE_PRIORITY_blackhole = "20"

LAYERDEPENDS_blackhole = "core openembedded-layer"
LAYERSERIES_COMPAT_blackhole = "scarthgap"
