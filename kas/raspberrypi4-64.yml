header:
  version: 14
  includes:
    - kas/common.yml

machine: raspberrypi4-64

local_conf_header:
  blackhole-rpi4: |
    ENABLE_UART = "1"
    # U-Boot + RAUC hang on first Pi 4 bring-up (4 raspberries, ACT off).
    # Boot the kernel directly until U-Boot/HDMI is sorted; RAUC A/B via U-Boot later.
    RPI_USE_U_BOOT = "0"
    CMDLINE:append = " console=tty1 cma=256M"
    DISABLE_OVERSCAN = "1"
    WKS_FILE = "sdimage-dual-blackhole-rpi.wks"
    WKS_SEARCH_PATH:append = ":${TOPDIR}/../meta-blackhole/wic"
    IMAGE_FSTYPES:append = " ext4"
    MACHINE_FEATURES:append = " vc4graphics"
