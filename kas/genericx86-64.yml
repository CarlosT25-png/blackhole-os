header:
  version: 14
  includes:
    - kas/common.yml

machine: genericx86-64

local_conf_header:
  blackhole-x86: |
    WKS_FILE = "sdimage-dual-blackhole-x86.wks"
    WKS_SEARCH_PATH:append = ":${TOPDIR}/../meta-blackhole/wic"
    IMAGE_FSTYPES:append = " ext4"
    EFI_PROVIDER = "grub-efi"
    PACKAGECONFIG:append:pn-mesa = " va"
    IMAGE_INSTALL:append = " libva libva-utils mesa-megadriver"
