server {
    listen 127.0.0.1:80 default_server;
    server_name _;

    # Persistent overlay synced from the hosted panel; seeded from the image
    # on first boot. Installed PWAs stay in /var/lib/blackhole/apps.json.
    root /var/lib/blackhole/shell;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
