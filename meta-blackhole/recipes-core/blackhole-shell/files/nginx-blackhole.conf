server {
    listen 127.0.0.1:80 default_server;
    server_name _;

    root /usr/share/blackhole/shell;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
