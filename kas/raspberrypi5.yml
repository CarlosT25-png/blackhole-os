header:
  version: 14
  includes:
    - common.yml

machine: raspberrypi5

repos:
  meta-lts-mixins:
    url: git://git.yoctoproject.org/meta-lts-mixins
    branch: scarthgap/u-boot

local_conf_header:
  blackhole-rpi5: |
    ENABLE_UART = "1"
    RPI_USE_U_BOOT = "1"
    WKS_FILE = "sdimage-dual-blackhole-rpi.wks"
    WKS_SEARCH_PATH:append = ":${TOPDIR}/../meta-blackhole/wic"
    IMAGE_FSTYPES:append = " ext4"
    MACHINE_FEATURES:append = " vc4graphics"
